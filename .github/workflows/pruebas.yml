name: Flujo de trabajo para construir y ejecutar los tests
on:
  workflow_dispatch:
  push:
    branches: [ desarrollo ]
  pull_request:
    branches: [ desarrollo ]
  schedule:
    - cron: '1 23 * * 0-4'
jobs:
  construir:
    name: Construir artefacto
    runs-on: ubuntu-latest

    env:
      GITHUB_LOGIN: ${{ github.actor }}
      GITHUB_PACKAGES: ${{ secrets.GHTOKEN }}
      GITHUB_OAUTH: ${{ secrets.GHTOKEN }}

    steps:
      - name: Clonando el repositorio y estableciendo el espacio de trabajo
        uses: actions/checkout@v3

      - name: Configurando java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '16'

      - name: Dando permisos al wrapper Gradle
        run: chmod +x gradlew

      - name: Construyendo el artefacto
        run: ./gradlew assemble

  test:
    name: Ejecutar tests
    runs-on: ubuntu-latest
    needs: construir

    env:
      GITHUB_LOGIN: ${{ github.actor }}
      GITHUB_PACKAGES: ${{ secrets.GHTOKEN }}
      GITHUB_OAUTH: ${{ secrets.GHTOKEN }}

    steps:
      - name: Clonando el repositorio y estableciendo el espacio de trabajo
        uses: actions/checkout@v3

      - name: Configurando java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '16'

      - name: Dando permisos al wrapper Gradle
        run: chmod +x gradlew

      - name: Ejecutando test
        run: ./gradlew test
